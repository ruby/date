name: build

on:
  push:
  pull_request:
  schedule:
    - cron: '10 3 * * *'

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master
    with:
      engine: cruby
      min_version: 2.6

  build:
    if: ${{ startsWith(github.repository, 'ruby/') || github.event_name != 'schedule' }}
    name: build (${{ matrix.ruby }} / ${{ matrix.os }})
    needs: ruby-versions
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJson(needs.ruby-versions.outputs.versions) }}
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        exclude:
          - ruby: head
            os: windows-latest
        include:
          - ruby: mingw
            os: windows-latest
          - ruby: mswin-head
            os: windows-2022
          - ruby: mswin-4.0
            os: windows-2022
          - ruby: truffleruby
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Ruby
      uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # 'bundle install' and cache
    - run: choco install gperf
      if: ${{ startsWith(matrix.ruby, 'mswin') }}
    - name: Run test
      run: bundle exec rake compile test
